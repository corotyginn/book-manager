<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Book Manager</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <h1>Моя библиотека</h1>

    <ul id="book-list"></ul>
    <script src="/static/script.js"></script>
</body>
</html>
